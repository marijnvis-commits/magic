name: Dagelijkse prijzen

on:
  schedule:
    - cron: "17 4 * * *"   # elke dag rond 06:17 Nederlandse tijd (zomertijd)
  workflow_dispatch:       # handmatig starten via de knop "Run workflow"

permissions:
  contents: write

concurrency:
  group: prijzen
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prijzen ophalen bij TCGdex
        run: node scripts/fetch-prices.mjs

      - name: App-data bouwen
        run: node scripts/build-app-data.mjs

      - name: Opslaan in de repository
        run: |
          git config user.name "prijzen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data app-data.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
          else
            git commit -m "Prijzen $(date -u +%F)"
            git push
          fi
